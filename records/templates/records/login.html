{% extends 'records/base.html' %}

{% block title %}Staff Login - UpacharVerdict{% endblock %}

{% block content %}
    <div style="max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #ccc; border-radius: 10px; background-color: #f9f9f9;">
        <h2 style="text-align: center;">Staff Login</h2>
        <hr style="margin-bottom: 20px;">
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" style="width: 100%; padding: 10px; background-color: #2b6cb0; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;">
                Log In
            </button>
        </form>
    </div>
{% endblock %}
